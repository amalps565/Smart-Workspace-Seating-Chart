services:
  postgres:
    # Keep in sync with the Testcontainers image in backend/src/test/.../TestcontainersConfiguration.java.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seating
      POSTGRES_USER: seating
      POSTGRES_PASSWORD: seating
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seating -d seating"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
