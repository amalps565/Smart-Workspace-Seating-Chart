spring:
  application:
    name: seating
  datasource:
    # Defaults match docker-compose.yml; override with environment variables elsewhere.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seating}
    username: ${DB_USERNAME:seating}
    password: ${DB_PASSWORD:seating}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    # Dev-only default (HMAC-SHA256 needs at least 32 bytes). Always set JWT_SECRET outside local development.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:8h}
  booking:
    # The office's time zone; "today" and booking dates are local dates in this zone.
    zone: ${BOOKING_ZONE:UTC}
    # Bookings are allowed from today up to this many days ahead.
    window-days: 14
